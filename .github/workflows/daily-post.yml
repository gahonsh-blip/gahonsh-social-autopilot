name: Daily post preview

# Renders the same post the Apps Script publishes, so there is always a public,
# dated page showing exactly what the automation wrote today. No secrets needed.
on:
  schedule:
    - cron: '0 3 * * *'   # 08:30 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

# A manual run and the cron run can overlap; two pushes would fight over the
# same branch. Queue them instead of cancelling, so today's page is never lost.
concurrency:
  group: daily-post-preview
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the sources exist
        run: |
          for f in config.gs calendar.gs content.gs media.gs publishers.gs code.gs; do
            test -f "$f" || { echo "missing source file: $f"; exit 1; }
          done
      - name: Run the mock tests
        run: npm test
      - name: Render today's post
        run: node render-today.js
      - name: Commit the page
        run: |
          git config user.name "GAHONSH autopilot"
          git config user.email "gahonsh@gmail.com"
          git add docs
          git diff --staged --quiet || git commit -m "post: $(date -u +%Y-%m-%d) preview"
          # A human push can land between checkout and here; rebase once instead of failing.
          for attempt in 1 2 3; do
            git push && break
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep 5
          done
